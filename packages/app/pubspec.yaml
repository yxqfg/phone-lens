name: lens_mate
description: "PhoneLens — phone camera → dsh session over LAN/USB."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  camera_android: ^0.10.9
  web_socket_channel: ^3.0.1
  mobile_scanner: ^5.2.3
  image: ^4.3.0
  image_cropper: ^8.0.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  http: ^1.2.2
  uuid: ^4.5.1
  path_provider: ^2.1.4
  gal: ^2.3.0
  device_info_plus: ^10.1.0
  sensors_plus: ^6.0.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/about_bg.png
