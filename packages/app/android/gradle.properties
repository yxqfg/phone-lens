org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Keep the app's ndk.abiFilters (see app/build.gradle.kts) instead of letting
# the Flutter Gradle plugin reset them to the full platform list. Without this,
# every build ships arm64 + armeabi-v7a + x86_64 copies of the Flutter engine
# and ML Kit native libs (~74 MB APK instead of ~33 MB).
disable-abi-filtering=true
